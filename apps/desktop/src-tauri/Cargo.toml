[package]
name = "token-plan-media-hub-desktop"
version = "0.1.0"
description = "Token Plan Media Hub desktop application"
authors = ["Bayes Wang"]
edition = "2021"

[lib]
name = "token_plan_media_hub_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
time = { version = "0.3", features = ["formatting"] }
