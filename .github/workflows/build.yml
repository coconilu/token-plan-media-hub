name: Build Windows artifacts

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve artifact metadata
        id: metadata
        env:
          GIT_REF_NAME: ${{ github.ref_name }}
          GIT_REF_TYPE: ${{ github.ref_type }}
          GIT_SHA: ${{ github.sha }}
        shell: pwsh
        run: |
          $config = Get-Content -Raw -Encoding utf8 "apps/desktop/src-tauri/tauri.conf.json" |
            ConvertFrom-Json
          $version = [string]$config.version
          if ($version -notmatch '^\d+\.\d+\.\d+(?:[-.][0-9A-Za-z.-]+)?$') {
            throw "Unsupported application version: $version"
          }
          if ($env:GIT_REF_TYPE -eq "tag" -and $env:GIT_REF_NAME -ne "v$version") {
            throw "Tag $env:GIT_REF_NAME does not match application version v$version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "short_sha=$($env:GIT_SHA.Substring(0, 7))" >> $env:GITHUB_OUTPUT

      - name: Build NSIS installer
        run: pnpm desktop:build

      - name: Package portable ZIP
        run: pnpm desktop:package-portable

      - name: Verify artifacts and write checksums
        shell: pwsh
        run: |
          $bundleRoot = "apps/desktop/src-tauri/target/release/bundle"
          $installers = @(
            Get-ChildItem -LiteralPath "$bundleRoot/nsis" -Filter "*.exe" -File
          )
          $archives = @(
            Get-ChildItem -LiteralPath "$bundleRoot/portable" -Filter "*.zip" -File
          )
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installers.Count)"
          }
          if ($archives.Count -ne 1) {
            throw "Expected exactly one portable ZIP, found $($archives.Count)"
          }

          $checksumPath = "$bundleRoot/SHA256SUMS.txt"
          @($installers[0], $archives[0]) |
            ForEach-Object {
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            } |
            Set-Content -LiteralPath $checksumPath -Encoding utf8
          Get-Content -LiteralPath $checksumPath

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: token-plan-media-hub-${{ steps.metadata.outputs.version }}-windows-x64-${{ steps.metadata.outputs.short_sha }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/portable/*.zip
            apps/desktop/src-tauri/target/release/bundle/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
