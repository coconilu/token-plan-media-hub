name: Build Windows artifacts

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve release metadata
        id: metadata
        env:
          GIT_SHA: ${{ github.sha }}
        shell: pwsh
        run: |
          $config = Get-Content -Raw -Encoding utf8 "apps/desktop/src-tauri/tauri.conf.json" |
            ConvertFrom-Json
          $version = [string]$config.version
          if ($version -notmatch '^\d+\.\d+\.\d+(?:[-.][0-9A-Za-z.-]+)?$') {
            throw "Unsupported application version: $version"
          }

          $shortSha = $env:GIT_SHA.Substring(0, 7)
          $tag = "v$version"
          "artifact_name=token-plan-media-hub-$version-windows-x64-$shortSha" >> $env:GITHUB_OUTPUT
          "short_sha=$shortSha" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Verify release target is available
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne "refs/heads/main") {
            throw "Releases must be dispatched from main; received $env:GITHUB_REF"
          }

          git ls-remote --exit-code --tags origin "refs/tags/$env:RELEASE_TAG" *> $null
          $tagStatus = $LASTEXITCODE
          if ($tagStatus -eq 0) {
            throw "Tag $env:RELEASE_TAG already exists"
          }
          if ($tagStatus -ne 2) {
            throw "Unable to verify whether tag $env:RELEASE_TAG exists"
          }

          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GH_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $releaseUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG"
          $release = $null
          try {
            $release = Invoke-RestMethod -Headers $headers -Uri $releaseUri
          } catch {
            if ($_.Exception.Response.StatusCode -ne [System.Net.HttpStatusCode]::NotFound) {
              throw
            }
          }
          if ($null -ne $release) {
            throw "Release $env:RELEASE_TAG already exists"
          }
          exit 0

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build NSIS installer
        run: pnpm desktop:build

      - name: Package portable ZIP
        run: pnpm desktop:package-portable

      - name: Verify artifacts and write checksums
        shell: pwsh
        run: |
          $bundleRoot = "apps/desktop/src-tauri/target/release/bundle"
          $installers = @(
            Get-ChildItem -LiteralPath "$bundleRoot/nsis" -Filter "*.exe" -File
          )
          $archives = @(
            Get-ChildItem -LiteralPath "$bundleRoot/portable" -Filter "*.zip" -File
          )
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installers.Count)"
          }
          if ($archives.Count -ne 1) {
            throw "Expected exactly one portable ZIP, found $($archives.Count)"
          }

          $releaseRoot = Join-Path $env:RUNNER_TEMP "release-assets-${{ steps.metadata.outputs.version }}-${{ steps.metadata.outputs.short_sha }}"
          New-Item -ItemType Directory -Path $releaseRoot | Out-Null
          $assets = @(
            Copy-Item -LiteralPath $installers[0].FullName -Destination $releaseRoot -PassThru
            Copy-Item -LiteralPath $archives[0].FullName -Destination $releaseRoot -PassThru
          )
          $checksumPath = Join-Path $releaseRoot "SHA256SUMS.txt"
          $assets |
            ForEach-Object {
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            } |
            Set-Content -LiteralPath $checksumPath -Encoding utf8
          Get-Content -LiteralPath $checksumPath

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: ${{ runner.temp }}/release-assets-${{ steps.metadata.outputs.version }}-${{ steps.metadata.outputs.short_sha }}/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Publish GitHub Release
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download verified Windows artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release-assets

      - name: Verify release assets
        working-directory: release-assets
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t installers < <(find . -maxdepth 1 -type f -name '*.exe' -print)
          mapfile -t archives < <(find . -maxdepth 1 -type f -name '*.zip' -print)
          mapfile -t checksums < <(find . -maxdepth 1 -type f -name 'SHA256SUMS.txt' -print)
          mapfile -t all_assets < <(find . -maxdepth 1 -type f -print)

          if [[ ${#installers[@]} -ne 1 || ${#archives[@]} -ne 1 || ${#checksums[@]} -ne 1 ]]; then
            echo "Expected exactly one installer, one portable ZIP, and one checksum file" >&2
            exit 1
          fi
          if [[ ${#all_assets[@]} -ne 3 ]]; then
            echo "Expected exactly three release assets, found ${#all_assets[@]}" >&2
            exit 1
          fi

          sha256sum --check SHA256SUMS.txt

      - name: Create tag and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f -print)
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "Token Plan Media Hub $RELEASE_TAG" \
            --generate-notes \
            --latest

          release_url="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url)"
          {
            echo "## GitHub Release"
            echo
            echo "- Version: \`$RELEASE_VERSION\`"
            echo "- Tag: \`$RELEASE_TAG\`"
            echo "- URL: $release_url"
          } >> "$GITHUB_STEP_SUMMARY"
